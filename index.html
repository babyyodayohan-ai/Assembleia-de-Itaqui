<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Assembleia de Deus - Itaqui</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Configuração de Cores do Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            church: {
              50: '#f0f7ff', 100: '#e0effe', 500: '#1d4ed8', 600: '#1e40af',
              700: '#1e3a8a', 800: '#172554', gold: '#d97706', goldLight: '#fef3c7'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Montserrat', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    /* Personalização da barra de rolagem */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    
    /* Animação de Gravação de Áudio */
    .recording-pulse { animation: pulse-red 1.5s infinite; }
    @keyframes pulse-red {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>

  <!-- Scripts do Firebase (Versão Compatível) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-blue-200">

  <!-- ========================================== -->
  <!-- TELA DE LOGIN E REGISTRO -->
  <!-- ========================================== -->
  <div id="authContainer" class="fixed inset-0 z-50 bg-slate-900/90 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden border border-slate-200 my-auto">
      
      <!-- Cabeçalho Auth -->
      <div class="bg-gradient-to-r from-church-800 via-church-700 to-church-600 p-6 text-center text-white relative">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-500/20 rounded-full border border-amber-400/30 mb-3">
          <i class="fa-solid fa-church text-3xl text-amber-400"></i>
        </div>
        <h2 class="font-display text-2xl font-bold tracking-tight">Assembleia de Deus</h2>
        <p class="text-xs text-blue-200 uppercase tracking-widest mt-1">Itaqui - RS</p>
      </div>

      <!-- Abas de Navegação Login/Registro -->
      <div class="flex border-b border-slate-200 bg-slate-50">
        <button id="tabBtnLogin" onclick="switchAuthTab('login')" class="flex-1 py-3 text-sm font-semibold text-church-700 border-b-2 border-church-600 transition">
          <i class="fa-solid fa-right-to-bracket mr-1"></i> Entrar
        </button>
        <button id="tabBtnRegister" onclick="switchAuthTab('register')" class="flex-1 py-3 text-sm font-semibold text-slate-500 border-b-2 border-transparent hover:text-slate-700 transition">
          <i class="fa-solid fa-user-plus mr-1"></i> Criar Conta
        </button>
      </div>

      <!-- Formulário de Login -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Usuário ou E-mail</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-400"></i>
            <input type="text" id="loginUserOrEmail" required placeholder="Ex: Admin2026 ou seu e-mail" 
                   class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-church-500 focus:bg-white outline-none text-sm transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Senha</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400"></i>
            <input type="password" id="loginPassword" required placeholder="Digite sua senha" 
                   class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-church-500 focus:bg-white outline-none text-sm transition">
          </div>
        </div>

        <div id="loginError" class="hidden text-red-600 text-xs bg-red-50 p-2.5 rounded-lg border border-red-200 flex items-center gap-2">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="loginErrorText">Erro ao entrar</span>
        </div>

        <button type="submit" id="loginSubmitBtn" class="w-full py-3 bg-gradient-to-r from-church-700 to-church-600 text-white font-bold rounded-xl shadow-lg hover:from-church-800 hover:to-church-700 transition flex items-center justify-center gap-2">
          <span>Entrar no Aplicativo</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <!-- Formulário de Registro -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="p-6 space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Seu Nome Completo</label>
          <div class="relative">
            <i class="fa-solid fa-id-card absolute left-3.5 top-3.5 text-slate-400"></i>
            <input type="text" id="regName" required placeholder="Ex: João da Silva" 
                   class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-church-500 outline-none text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">E-mail</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400"></i>
            <input type="email" id="regEmail" required placeholder="seu@email.com" 
                   class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-church-500 outline-none text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Senha (Mínimo 6 caracteres)</label>
          <div class="relative">
            <i class="fa-solid fa-key absolute left-3.5 top-3.5 text-slate-400"></i>
            <input type="password" id="regPassword" minlength="6" required placeholder="Sua senha secreta" 
                   class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-church-500 outline-none text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Foto de Perfil (Opcional)</label>
          <div class="flex items-center gap-3">
            <img id="regPhotoPreview" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=120&q=80" class="w-11 h-11 rounded-full object-cover border-2 border-slate-300">
            <input type="file" id="regPhotoInput" accept="image/*" onchange="previewProfilePhoto(this)" class="hidden">
            <button type="button" onclick="document.getElementById('regPhotoInput').click()" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded-lg transition">
              <i class="fa-solid fa-upload mr-1"></i> Escolher Foto
            </button>
          </div>
        </div>

        <div id="regError" class="hidden text-red-600 text-xs bg-red-50 p-2.5 rounded-lg border border-red-200 flex items-center gap-2">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="regErrorText">Erro ao cadastrar</span>
        </div>

        <button type="submit" id="regSubmitBtn" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-bold rounded-xl shadow-lg hover:from-emerald-700 transition flex items-center justify-center gap-2">
          <span>Finalizar Cadastro</span>
          <i class="fa-solid fa-check text-xs"></i>
        </button>
      </form>

    </div>
  </div>

  <!-- ========================================== -->
  <!-- APLICATIVO PRINCIPAL (PAINEL LOGADO) -->
  <!-- ========================================== -->
  <div id="mainApp" class="hidden flex-1 flex-col max-w-2xl mx-auto w-full bg-white shadow-xl h-screen relative pb-16">

    <!-- HEADER / NAVBAR -->
    <header class="bg-gradient-to-r from-church-800 via-church-700 to-church-600 text-white sticky top-0 z-30 shadow-md">
      <div class="px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-amber-400/20 border border-amber-300/40 flex items-center justify-center shadow-inner">
            <i class="fa-solid fa-church text-amber-400 text-xl"></i>
          </div>
          <div>
            <h1 class="font-display font-bold text-base leading-tight tracking-tight">AD ITAQUI</h1>
            <p class="text-[11px] text-blue-200 font-medium">Assembleia de Deus</p>
          </div>
        </div>

        <!-- Usuário Logado & Botão Sair -->
        <div class="flex items-center gap-2.5">
          <div class="flex items-center gap-2 bg-white/10 px-2.5 py-1 rounded-full border border-white/15">
            <img id="navUserProfilePic" src="" class="w-6 h-6 rounded-full object-cover border border-amber-300">
            <span id="navUserName" class="text-xs font-semibold max-w-[80px] truncate text-white">...</span>
            <span id="navAdminBadge" class="hidden bg-amber-500 text-slate-900 font-bold text-[9px] px-1.5 py-0.5 rounded-full uppercase">Admin</span>
          </div>
          <button onclick="handleLogout()" title="Sair da Conta" class="w-8 h-8 rounded-full bg-red-500/20 hover:bg-red-500/40 text-red-200 flex items-center justify-center transition">
            <i class="fa-solid fa-power-off text-xs"></i>
          </button>
        </div>
      </div>

      <!-- ALERTA DO DIA (Topo) -->
      <div id="todayAlertBanner" class="hidden bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 px-4 py-2 text-xs font-bold flex items-center justify-between shadow-inner animate-pulse">
        <div class="flex items-center gap-2 truncate">
          <i class="fa-solid fa-bullhorn text-sm"></i>
          <span id="todayAlertText" class="truncate">NOVO AVISO PUBLICADO!</span>
        </div>
        <button onclick="switchMainTab('avisos')" class="ml-2 bg-slate-950 text-amber-400 px-2 py-0.5 rounded text-[10px] uppercase tracking-wider font-extrabold">Ver</button>
      </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL DAS ABAS -->
    <main class="flex-1 flex flex-col relative overflow-hidden bg-slate-50">

      <!-- ABA 1: MURAL DE AVISOS -->
      <section id="secAvisos" class="flex-1 p-4 space-y-4 overflow-y-auto">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="font-display font-bold text-lg text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-scroll text-church-600"></i> Mural de Avisos
            </h2>
            <p class="text-xs text-slate-500">Programações da semana</p>
          </div>
          <span id="avisosCount" class="bg-blue-100 text-church-700 text-xs font-bold px-2.5 py-1 rounded-full">0</span>
        </div>
        
        <!-- Feed de Avisos -->
        <div id="avisosFeed" class="space-y-4 pb-4"></div>

        <!-- Tela Vazia -->
        <div id="emptyAvisos" class="hidden text-center py-12 px-4 bg-white rounded-2xl border border-dashed border-slate-300">
          <i class="fa-solid fa-calendar-xmark text-4xl text-slate-300 mb-2"></i>
          <p class="text-slate-600 text-sm font-semibold">Nenhum aviso publicado ainda.</p>
        </div>
      </section>

      <!-- ABA 2: CHAT DE MENSAGENS -->
      <section id="secMensagens" class="hidden flex-1 flex flex-col h-full bg-slate-100">
        <!-- Topo do Chat -->
        <div class="bg-white px-4 py-2.5 border-b border-slate-200 flex items-center justify-between text-xs text-slate-600 shadow-sm z-10">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
            <span class="font-bold text-slate-800">Grupo Oficial - AD Itaqui</span>
          </div>
        </div>

        <!-- Feed do Chat -->
        <div id="chatFeed" class="flex-1 p-4 overflow-y-auto space-y-3 bg-[radial-gradient(#e2e8f0_1px,transparent_1px)] [background-size:16px_16px]"></div>

        <!-- Barra de Digitação e Áudio -->
        <div class="bg-white p-3 border-t border-slate-200 flex flex-col gap-2 z-10">
          <!-- Status de Gravação -->
          <div id="audioRecordingBar" class="hidden bg-red-50 border border-red-200 rounded-xl p-2.5 flex items-center justify-between text-xs text-red-700">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 bg-red-600 rounded-full recording-pulse"></span>
              <span class="font-bold">Gravando áudio...</span>
              <span id="recordingTimer" class="font-mono font-bold">00:00</span>
            </div>
            <button onclick="cancelAudioRecording()" class="text-slate-500 hover:text-red-600 p-1"><i class="fa-solid fa-trash-can text-sm"></i></button>
          </div>

          <form id="chatForm" onsubmit="sendTextMessage(event)" class="flex items-center gap-2">
            <input type="text" id="chatInput" placeholder="Digite sua mensagem..." autocomplete="off" class="flex-1 py-2.5 px-4 bg-slate-100 border border-slate-200 rounded-full text-sm focus:bg-white focus:ring-2 focus:ring-church-500 outline-none">
            
            <button type="button" id="micBtn" onclick="toggleAudioRecording()" class="w-10 h-10 rounded-full bg-slate-200 text-slate-700 hover:bg-slate-300 flex items-center justify-center transition shadow-sm">
              <i id="micIcon" class="fa-solid fa-microphone text-base"></i>
            </button>
            <button type="submit" id="sendBtn" class="w-10 h-10 rounded-full bg-church-600 hover:bg-church-700 text-white flex items-center justify-center shadow-md active:scale-95 transition">
              <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
          </form>
        </div>
      </section>

      <!-- ABA 3: PAINEL DO ADMIN -->
      <section id="secAdmin" class="hidden flex-1 p-4 overflow-y-auto space-y-4">
        <div class="bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 p-4 rounded-2xl shadow-md flex items-center justify-between">
          <div>
            <h2 class="font-display font-bold text-lg flex items-center gap-2"><i class="fa-solid fa-shield-halved"></i> Painel Admin</h2>
            <p class="text-xs font-medium opacity-90">Publique comunicados oficias</p>
          </div>
        </div>

        <form id="avisoAdminForm" onsubmit="publishAviso(event)" class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Título *</label>
            <input type="text" id="avisoTitle" required placeholder="Ex: Culto da Vitória" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-amber-500 outline-none">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Horário & Data *</label>
              <input type="text" id="avisoTime" required placeholder="Ex: Hoje às 19:30h" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:ring-amber-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Tipo de Evento *</label>
              <select id="avisoType" required class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none">
                <option value="CULTO">CULTO</option><option value="ENSAIO">ENSAIO</option><option value="EVENTO">EVENTO</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Público Alvo *</label>
              <select id="avisoTarget" required class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none">
                <option value="GERAL">GERAL</option><option value="JOVEM">JOVEM</option><option value="INFANTIL">INFANTIL</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Foto (Opcional)</label>
              <input type="file" id="avisoCoverFile" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-amber-100 file:text-amber-800">
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Descrição</label>
            <textarea id="avisoDescription" rows="2" placeholder="Detalhes adicionais..." class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none"></textarea>
          </div>
          <button type="submit" id="btnPublishAviso" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-bullhorn"></i> <span>Publicar Aviso</span>
          </button>
        </form>
      </section>

    </main>

    <!-- MENU INFERIOR FIXO -->
    <nav class="absolute bottom-0 left-0 right-0 h-16 bg-white border-t border-slate-200 z-40 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] flex justify-around items-center">
      <button id="navBtnAvisos" onclick="switchMainTab('avisos')" class="flex flex-col items-center gap-1 text-church-600 font-bold w-full py-2">
        <i class="fa-solid fa-scroll text-lg"></i><span class="text-[10px]">Avisos</span>
      </button>
      <button id="navBtnMensagens" onclick="switchMainTab('mensagens')" class="flex flex-col items-center gap-1 text-slate-400 font-medium hover:text-church-600 w-full py-2 relative">
        <i class="fa-solid fa-comments text-lg"></i><span class="text-[10px]">Mensagens</span>
        <span id="unreadChatBadge" class="hidden absolute top-1 right-[35%] w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>
      </button>
      <button id="navBtnAdmin" onclick="switchMainTab('admin')" class="hidden flex-col items-center gap-1 text-slate-400 font-medium hover:text-amber-600 w-full py-2">
        <i class="fa-solid fa-shield-halved text-lg"></i><span class="text-[10px]">Painel Admin</span>
      </button>
    </nav>
  </div>

  <!-- ========================================== -->
  <!-- LÓGICA DO JAVASCRIPT & FIREBASE -->
  <!-- ========================================== -->
  <script>
    /* 1. CONFIGURAÇÃO DO FIREBASE (Suas Credenciais) */
    const firebaseConfig = {
      apiKey: "AIzaSyCTDM1w_Bl2uJhcsVQXyUivAR4vQWq1DZ4",
      authDomain: "igrejadeitaqui
